<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Зворотній зв'язок - Tech Start-upt</title>
</head>
<body>
    <header>
        <h1>Форма зворотнього зв'язку</h1>
    </header>

    <main>
        <form action="#" method="post">
            <fieldset>
                <legend>Персональна інформація</legend>
                
                <label for="fullname">Прізвище та ім'я:</label><br>
                <input type="text" id="fullname" name="fullname" required><br><br>

                <label for="email">E-mail:</label><br>
                <input type="email" id="email" name="email" required><br><br>

                <label for="age">Вік:</label><br>
                <input type="number" id="age" name="age" min="1" required><br><br>

                <p>Освіта:</p>
                <input type="radio" id="edu_full" name="education" value="повна">
                <label for="edu_full">Повна</label><br>
                <input type="radio" id="edu_inc" name="education" value="неповна">
                <label for="edu_inc">Неповна</label><br>
                <input type="radio" id="edu_high" name="education" value="вища">
                <label for="edu_high">Вища</label><br>
                <input type="radio" id="edu_prof" name="education" value="професійна">
                <label for="edu_prof">Професійна</label><br><br>

                <p>Інтереси:</p>
                <input type="checkbox" id="int_sci" name="interests" value="науковець">
                <label for="int_sci">Науковець</label><br>
                <input type="checkbox" id="int_inv" name="interests" value="інвестор">
                <label for="int_inv">Інвестор</label><br>
                <input type="checkbox" id="int_prom" name="interests" value="промоутер">
                <label for="int_prom">Промоутер</label><br>
                <input type="checkbox" id="int_gov" name="interests" value="держслужбовець">
                <label for="int_gov">Держслужбовець</label><br><br>
            </fieldset>
    </main>
</body>
</html>
